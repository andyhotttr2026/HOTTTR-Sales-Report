<title>HOTTTR Reports</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0e0f17;--card:#1a1d2b;--line:#2a2e40;--text:#e8eaf0;--dim:#8890a6;--cyan:#4db8ff;--green:#3ddc84;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;padding:48px 20px;display:flex;flex-direction:column;align-items:center;gap:22px}
  h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:-14px}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  a.card{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:20px 26px;color:var(--text);text-decoration:none;min-width:200px;transition:border-color .15s}
  a.card:hover{border-color:var(--cyan)}
  a.card .big{font-size:17px;font-weight:700} a.card.daily .big{color:var(--green)} a.card.shift .big{color:var(--cyan)}
  a.card .lbl{color:var(--dim);font-size:12px}
  .browse{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;
    display:flex;flex-direction:column;gap:16px;width:100%;max-width:440px}
  .browse h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0}
  .pick{display:flex;flex-direction:column;gap:6px}
  .pick label{font-size:13px;color:var(--dim)}
  select{background:#0e0f17;color:var(--text);border:1px solid var(--line);border-radius:9px;
    padding:11px 12px;font-size:14px;font-family:inherit;cursor:pointer;width:100%}
  select:focus{outline:2px solid var(--cyan);outline-offset:1px}
  .foot{color:#565d76;font-size:12px}
</style>
<h1>📊 HOTTTR Reports</h1>
<div class="sub">Auto-updated from Infloww · UK time (BST)</div>

<div class="row">
  <a class="card daily" href="daily.html"><span class="big">💵 Latest Daily</span><span class="lbl">most recent full day</span></a>
  <a class="card shift" href="shift.html"><span class="big">🌙 Latest Shift</span><span class="lbl">most recent shift</span></a>
</div>

<div class="browse">
  <h2>📅 Browse previous dates</h2>
  <div class="pick">
    <label for="d">Daily report by date</label>
    <select id="d" onchange="if(this.value)location.href=this.value">
      <option value="">Pick a day…</option>
      <option value="archive/daily-2026-08-10.html">Aug 10, 2026</option><option value="archive/daily-2026-08-09.html">Aug 9, 2026</option><option value="archive/daily-2026-08-08.html">Aug 8, 2026</option><option value="archive/daily-2026-08-07.html">Aug 7, 2026</option>
    </select>
  </div>
  <div class="pick">
    <label for="s">Shift report by date</label>
    <select id="s" onchange="if(this.value)location.href=this.value">
      <option value="">Pick a shift…</option>
      <option value="archive/shift-2026-08-15-s1.html">Aug 15, 2026 · Shift 1</option><option value="archive/shift-2026-08-14-s3.html">Aug 14, 2026 · Shift 3</option><option value="archive/shift-2026-08-14-s2.html">Aug 14, 2026 · Shift 2</option><option value="archive/shift-2026-08-14-s1.html">Aug 14, 2026 · Shift 1</option><option value="archive/shift-2026-08-13-s3.html">Aug 13, 2026 · Shift 3</option><option value="archive/shift-2026-08-13-s2.html">Aug 13, 2026 · Shift 2</option><option value="archive/shift-2026-08-13-s1.html">Aug 13, 2026 · Shift 1</option><option value="archive/shift-2026-08-12-s3.html">Aug 12, 2026 · Shift 3</option><option value="archive/shift-2026-08-12-s2.html">Aug 12, 2026 · Shift 2</option><option value="archive/shift-2026-08-12-s1.html">Aug 12, 2026 · Shift 1</option><option value="archive/shift-2026-08-11-s3.html">Aug 11, 2026 · Shift 3</option><option value="archive/shift-2026-08-11-s2.html">Aug 11, 2026 · Shift 2</option><option value="archive/shift-2026-08-11-s1.html">Aug 11, 2026 · Shift 1</option><option value="archive/shift-2026-08-10-s3.html">Aug 10, 2026 · Shift 3</option><option value="archive/shift-2026-08-10-s2.html">Aug 10, 2026 · Shift 2</option><option value="archive/shift-2026-08-10-s1.html">Aug 10, 2026 · Shift 1</option><option value="archive/shift-2026-08-09-s3.html">Aug 9, 2026 · Shift 3</option><option value="archive/shift-2026-08-09-s2.html">Aug 9, 2026 · Shift 2</option><option value="archive/shift-2026-08-09-s1.html">Aug 9, 2026 · Shift 1</option><option value="archive/shift-2026-08-08-s3.html">Aug 8, 2026 · Shift 3</option><option value="archive/shift-2026-08-08-s2.html">Aug 8, 2026 · Shift 2</option><option value="archive/shift-2026-08-08-s1.html">Aug 8, 2026 · Shift 1</option><option value="archive/shift-2026-08-07-s3.html">Aug 7, 2026 · Shift 3</option><option value="archive/shift-2026-08-07-s2.html">Aug 7, 2026 · Shift 2</option><option value="archive/shift-2026-08-07-s1.html">Aug 7, 2026 · Shift 1</option>
    </select>
  </div>
</div>

<div class="foot">Shared with your team · anyone with the link can view</div>
