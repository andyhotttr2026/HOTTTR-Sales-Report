name: HOTTTR Slack Daily Report

on:
  schedule:
    # 04:19 UTC = 05:19 BST (summer) / 04:19 GMT (winter).
    # NOTE: minute :19 (not :00) deliberately dodges GitHub's top-of-hour cron
    # congestion, which was delaying/dropping runs. GitHub cron is still best-effort;
    # for exact-time guarantees, trigger via the API from an external scheduler.
    - cron: '19 4 * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Slack daily report
        env:
          INFLOWW_API_KEY: ${{ secrets.INFLOWW_API_KEY }}
          INFLOWW_OID:     ${{ secrets.INFLOWW_OID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python slack_daily_report.py
