name: HOTTTR Slack Daily Report

on:
  schedule:
    # 04:19 UTC = 05:19 BST (summer) / 04:19 GMT (winter).
    # NOTE: minute :19 (not :00) deliberately dodges GitHub's top-of-hour cron
    # congestion, which was delaying/dropping runs. GitHub cron is still best-effort;
    # for exact-time guarantees, trigger via the API from an external scheduler.
    - cron: '19 4 * * *'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write   # to commit the generated dashboard into docs/ for Pages

concurrency:
  group: hotttr-reports   # shared with the shift report so docs/ pushes don't race
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build daily dashboard + Slack payload
        env:
          INFLOWW_API_KEY: ${{ secrets.INFLOWW_API_KEY }}
          INFLOWW_OID:     ${{ secrets.INFLOWW_OID }}
        run: python slack_daily_report.py build

      - name: Publish dashboard to docs/
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then echo "no dashboard changes"; else
            git commit -m "Update daily dashboard [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python slack_daily_report.py send
