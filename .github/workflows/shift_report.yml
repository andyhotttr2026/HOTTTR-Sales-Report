name: HOTTTR Shift Report

on:
  schedule:
    # Manila is UTC+8 (no DST). Report fires just after each shift boundary.
    # Minute :19 (not :00) dodges GitHub's top-of-hour cron congestion, which
    # delays/drops runs. GitHub cron is still best-effort; for exact-time
    # guarantees, trigger via the API from an external scheduler.
    - cron: '19 8 * * *'    # 16:19 MNL -> end of Shift 1 (08:00-16:00)
    - cron: '19 16 * * *'   # 00:19 MNL -> end of Shift 2 (16:00-24:00)
    - cron: '19 0 * * *'    # 08:19 MNL -> end of Shift 3 (00:00-08:00)
  workflow_dispatch:       # manual trigger; optionally set which shift
    inputs:
      shift:
        description: 'Force a shift (1, 2, or 3). Leave blank to auto-detect.'
        required: false
        default: ''

permissions:
  contents: write   # to commit the generated dashboard into docs/ for Pages

concurrency:
  group: hotttr-reports   # shared with the daily report so docs/ pushes don't race
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build report (pull API, generate docs/ dashboard + Slack payload)
        env:
          INFLOWW_API_KEY: ${{ secrets.INFLOWW_API_KEY }}
          INFLOWW_OID:     ${{ secrets.INFLOWW_OID }}
          SHIFT:           ${{ github.event.inputs.shift }}
        run: python shift_report.py build

      # Publish the visual dashboard to docs/ (served by Pages). Best-effort:
      # a git failure here must NOT block the Slack post below.
      - name: Publish dashboard to docs/
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then echo "no dashboard changes"; else
            git commit -m "Update shift dashboard [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python shift_report.py send
